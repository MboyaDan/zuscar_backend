# UNVERIFIED: has not run (no GitHub in the authoring sandbox). Action versions are major tags.
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: zuscar, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zuscar" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://zuscar:ci-only@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go mod tidy && go mod verify && git diff --exit-code go.mod go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.31.1" }
      - run: sqlc diff
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 -v ./... | tee test.log && ! grep -q -- "--- SKIP" test.log   # a skipped DB test must fail CI
      - run: go build ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target dev -t zuscar-backend-dev .
      - run: docker build -t zuscar-backend .
