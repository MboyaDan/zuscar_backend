        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/orders/{id}/finalise:
    post:
      summary: Finalise an order into a sale
      description: 'Needs permission sales.create and the Idempotency-Key header. One transaction: claims the key, locks the order, takes the next gapless receipt number, writes the sale, immutable line snapshots and payments, and closes the order. Prices and totals are never taken from the request. Cash is confirmed at once; mpesa_manual, card_manual and bank_manual are recorded as pending_confirmation and need a reference. Payments may not add up to more than the total (400); an unpaid or partly paid sale keeps a due balance. Discounts need sales.discount, a reason and an existing line (403 discount_not_permitted). A role limited to bar products gets 403 bar_only. Cash needs an open shift for the caller (409 shift_required); the sale and its payments carry that shift. Errors 409: order_already_finalised, order_closed, order_empty, order_changed, duplicate_reference, tax_exclusive_unsupported, idempotency_conflict; 422 idempotency_key_reused. A replay returns the stored answer with Idempotent-Replayed: true.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: false
        content:
          application/json:
