openapi: 3.0.3
info:
  title: Zuscar API
  version: 0.0.0
  description: 'Kept current every stage. Stage 4 documents only the platform endpoints. The planned route inventory is docs/api/routes.csv.
    Money is always integer cents.

    '
servers:
- url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Process liveness
      operationId: healthz
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
  /api/v1/health:
    get:
      summary: Liveness through the web proxy
      description: Reachable at the web origin as /api/v1/health; used by the connection indicator.
      operationId: apiHealth
      responses:
        '200':
          description: Backend is up
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
  /readyz:
    get:
      summary: Readiness (database reachable)
      operationId: readyz
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ready
        '503':
          description: Database not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/auth/login:
    post:
      summary: Sign in
      description: Sets the HttpOnly session cookie and the script-readable CSRF cookie. Rejects a foreign Origin. Locks the
        account after repeated failures.
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: &id002
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      display_name:
                        type: string
                  must_change_password:
                    type: boolean
                  expires_at:
                    type: string
                    format: date-time
        '400': &id001
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401': *id001
        '403': *id001
        '423': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
  /api/v1/auth/me:
    get:
      summary: Current user, roles and permissions
      description: Permissions are read from the database on every request.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: *id002
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  must_change_password:
                    type: boolean
                  auth_method:
                    type: string
                    enum:
                    - password
                    - pin
                  session:
                    type: object
        '401': *id001
      security:
      - sessionCookie: []
  /api/v1/auth/logout:
    post:
      summary: Sign out
      description: Revokes the session and clears both cookies. Needs X-CSRF-Token.
      responses:
        '204':
          description: Success
        '401': *id001
        '403': *id001
      security:
      - sessionCookie: []
  /api/v1/auth/change-password:
    post:
      summary: Change own password
      description: Ends every other session of the user. Wrong current passwords count toward lockout.
      responses:
        '204':
          description: Success
        '400': *id001
        '401': *id001
        '403': *id001
        '423': *id001
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
  /api/v1/auth/reauth:
    post:
      summary: Confirm password for sensitive actions
      description: Valid for 5 minutes. PIN sessions cannot do this.
      responses:
        '204':
          description: Success
        '401': *id001
        '403': *id001
        '423': *id001
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
  /api/v1/auth/pin-switch:
    post:
      summary: Hand the terminal to another floor user by PIN
      description: Floor roles only. The new session never outlives the current one.
      responses:
        '200':
          description: Switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: *id002
                  must_change_password:
                    type: boolean
                  expires_at:
                    type: string
                    format: date-time
        '400': *id001
        '401': *id001
        '403': *id001
        '423': *id001
        '429': *id001
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - pin
              properties:
                username:
                  type: string
                pin:
                  type: string
                  pattern: ^[0-9]{4,8}$
  /api/v1/users:
    get:
      summary: List users
      description: 'Needs permission users.update. Keyset paging: limit (1 to 200, default 50) and the opaque cursor from next_cursor. q matches a username prefix or part of a display name.'
      security:
      - sessionCookie: []
      parameters:
      - {name: status, in: query, schema: {type: string, enum: [active, inactive]}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  next_cursor:
                    type: string
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Create a user
      description: 'Needs permission users.create. The account must change its password at first login. A role can only be granted by someone who holds its permissions, or by a system administrator. The password is never returned.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - username
                - display_name
                - password
                properties:
                  username: {type: string}
                  display_name: {type: string}
                  password: {type: string}
                  roles:
                    type: array
                    items:
                      type: string
      responses:
        '201':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/users/{id}:
    get:
      summary: Get one user
      description: 'Needs permission users.update.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401': *id001
        '403': *id001
        '404': *id001
    patch:
      summary: Change the display name
      description: 'Needs permission users.update. The username never changes. Audited with before and after values.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - display_name
                properties:
                  display_name: {type: string}
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
    delete:
      summary: Delete a user with no history
      description: 'Needs permission users.delete. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Accounts that signed in, assigned a role or appear in the audit trail are refused with has_history: deactivate them instead.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Done
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/users/{id}/roles:
    put:
      summary: Replace the user's roles
      description: 'Needs permission users.update. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Errors: escalation_refused, protected_account, self_action_refused, last_super_admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - roles
                properties:
                  roles:
                    type: array
                    items:
                      type: string
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/users/{id}/deactivate:
    post:
      summary: Deactivate a user
      description: 'Needs permission users.deactivate. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Ends every session of the account in the same transaction. The last active Super Admin is refused (last_super_admin). Repeating is harmless.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                  reason: {type: string}
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/users/{id}/reactivate:
    post:
      summary: Reactivate a user
      description: 'Needs permission users.update. Needs a password entered in the last 5 minutes (error reauth_required otherwise).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/users/{id}/reset-password:
    post:
      summary: Set a temporary password
      description: 'Needs permission users.update. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Forces a change at next login and ends all sessions of the account. Not for your own account (use change-password).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - new_password
                properties:
                  new_password: {type: string}
      responses:
        '204':
          description: Done
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/users/{id}/pin:
    put:
      summary: Set a fast-switch PIN
      description: 'Needs permission users.update. Floor roles only (A-07); 409 pin_not_allowed otherwise.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - pin
                properties:
                  pin: {type: string, pattern: '^[0-9]{4,8}$'}
      responses:
        '204':
          description: Done
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/roles:
    get:
      summary: List roles with their permissions
      description: 'Needs permission roles.manage.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401': *id001
        '403': *id001
    post:
      summary: Create an empty role
      description: 'Needs permission roles.manage. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Permissions are granted separately.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - name
              properties:
                  code: {type: string, pattern: '^[a-z][a-z0-9_]{1,39}$'}
                  name: {type: string}
                  description: {type: string}
      responses:
        '201':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/Role'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/roles/assignable:
    get:
      summary: Roles the caller may grant
      description: 'Needs permission users.update (not roles.manage). Applies the same rule as changing a user''s roles: protected roles only with system.admin, otherwise only roles whose permissions the caller already holds. Use it to fill a role picker.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Grantable roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code: {type: string}
                        name: {type: string}
                        description: {type: string}
        '401': *id001
        '403': *id001
  /api/v1/roles/{id}:
    patch:
      summary: Change a role name and description
      description: 'Needs permission roles.manage. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Protected roles are refused (protected_role). The code never changes.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                  name: {type: string}
                  description: {type: string}
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/Role'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
    delete:
      summary: Delete an unassigned role
      description: 'Needs permission roles.manage. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Refused while the role is assigned (role_in_use) and always for protected roles.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Done
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/roles/{id}/permissions:
    put:
      summary: Replace a role's permission set
      description: 'Needs permission permissions.assign. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. system.admin is refused for everyone and protected roles are refused. Without system.admin you can only add permissions you hold (escalation_refused). The response lists the users affected; changes apply on their next request.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permissions
              properties:
                  permissions:
                    type: array
                    items:
                      type: string
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/Role'
                  affected_users:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer, format: int64}
                        username: {type: string}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/permissions:
    get:
      summary: List permissions
      description: 'Needs permission roles.manage.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer, format: int64}
                        key: {type: string}
                        description: {type: string}
                        is_protected: {type: boolean}
        '401': *id001
        '403': *id001
  /api/v1/settings:
    get:
      summary: Read business settings
      description: 'Any signed-in user. All settings are non-secret business configuration, including tax_config_status (provisional_unverified or verified) and, once verified, tax_config_verified_by and tax_config_verified_at.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties: true
        '401': *id001
    patch:
      summary: Change business settings
      description: 'Needs permission system.admin. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Atomic: one invalid key changes nothing. Editable keys: business_name, address, phone, receipt_footer, timezone, tax_inclusive, negative_stock_policy (warn_override or block), checkin_time, checkout_time, idempotency_ttl_hours, tax_config_status. currency and the verification record cannot be changed. Setting tax_config_status to verified records who and when and is audited as settings.tax_config_verified. Changing tax_inclusive after verification returns the status to provisional_unverified.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - settings
              properties:
                settings:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: All settings after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties: true
        '400': *id001
        '401': *id001
        '403': *id001
  /api/v1/tax-rates:
    get:
      summary: List tax categories
      description: 'Any signed-in user. Treatment is standard, zero_rated or exempt; rate_bp is basis points.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxRate'
        '401': *id001
    post:
      summary: Add a tax category
      description: 'Needs permission system.admin. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. The treatment is fixed at creation; zero_rated and exempt need rate_bp 0.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - name
              - rate_bp
              - treatment
              properties:
                code: {type: string, pattern: '^[a-z][a-z0-9_]{1,39}$'}
                name: {type: string}
                rate_bp: {type: integer, minimum: 0, maximum: 10000}
                treatment: {type: string, enum: [standard, zero_rated, exempt]}
      responses:
        '201':
          description: The category
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_rate:
                    $ref: '#/components/schemas/TaxRate'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/tax-rates/{id}:
    patch:
      summary: Change a tax category
      description: 'Needs permission system.admin. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Changing the rate or the active flag after verification returns tax_config_status to provisional_unverified.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                rate_bp: {type: integer, minimum: 0, maximum: 10000}
                active: {type: boolean}
      responses:
        '200':
          description: The category
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_rate:
                    $ref: '#/components/schemas/TaxRate'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/audit-logs:
    get:
      summary: Read the audit trail, newest first
      description: 'Needs permission audit.view. Security events (users, roles, permissions, sessions, settings, tax categories) are only returned to a system administrator or an Accountant / Auditor; everyone else with audit.view sees operational events only.'
      security:
      - sessionCookie: []
      parameters:
      - {name: action, in: query, schema: {type: string}}
      - {name: entity_type, in: query, schema: {type: string}}
      - {name: result, in: query, schema: {type: string, enum: [success, denied, failed]}}
      - {name: actor_id, in: query, schema: {type: integer, format: int64}}
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  next_cursor:
                    type: string
        '400': *id001
        '401': *id001
        '403': *id001
  /api/v1/menu:
    get:
      summary: What can be sold now
      description: 'Needs permission orders.manage. Active categories with their available products and active modifiers.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {categories: {type: array, items: {type: object}}}}
        '401': *id001
        '403': *id001
  /api/v1/categories:
    get:
      summary: List categories
      description: 'Needs permission catalogue.manage. '
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Category'}}}}
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Add a category
      description: 'Needs permission catalogue.manage. Module is fixed at creation. Name is unique per module (409 conflict).'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [module, name], properties: {module: {type: string, enum: [restaurant, bar]}, name: {type: string}, sort_order: {type: integer}}}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {category: {$ref: '#/components/schemas/Category'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/categories/{id}:
    patch:
      summary: Change a category
      description: 'Needs permission catalogue.manage. '
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {name: {type: string}, sort_order: {type: integer}, active: {type: boolean}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {category: {$ref: '#/components/schemas/Category'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/products:
    get:
      summary: List products
      description: 'Needs permission catalogue.manage. Filters: category_id, module, available, q (name or SKU).'
      security:
      - sessionCookie: []
      parameters:
      - {name: category_id, in: query, schema: {type: integer, format: int64}}
      - {name: module, in: query, schema: {type: string, enum: [restaurant, bar]}}
      - {name: available, in: query, schema: {type: boolean}}
      - {name: q, in: query, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Product'}}}}
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Add a product
      description: 'Needs permission catalogue.manage. category_id, price_cents, tax_rate_id and kitchen_routed are required: there is no default tax category. The module comes from the category. The opening price is the first price_history row.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [category_id, name, price_cents, tax_rate_id, kitchen_routed], properties: {category_id: {type: integer, format: int64}, name: {type: string}, sku: {type: string}, price_cents: {type: integer, format: int64, minimum: 0}, tax_rate_id: {type: integer, format: int64}, kitchen_routed: {type: boolean}, modifier_ids: {type: array, items: {type: integer, format: int64}}}}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {product: {$ref: '#/components/schemas/Product'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/products/{id}:
    patch:
      summary: Change a product
      description: 'Needs permission catalogue.manage. Not the price or availability (own endpoints). A product may only move to a category of the same module. An empty sku clears it; modifier_ids replaces the set.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {category_id: {type: integer, format: int64}, name: {type: string}, sku: {type: string}, tax_rate_id: {type: integer, format: int64}, kitchen_routed: {type: boolean}, modifier_ids: {type: array, items: {type: integer, format: int64}}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {product: {$ref: '#/components/schemas/Product'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/products/{id}/price:
    put:
      summary: Change the price
      description: 'Needs permission catalogue.manage. Adds an immutable price_history row and an audit entry; the same price again changes nothing.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [price_cents], properties: {price_cents: {type: integer, format: int64, minimum: 0}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {product: {$ref: '#/components/schemas/Product'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/products/{id}/availability:
    put:
      summary: Mark a product available or not
      description: 'Needs permission catalogue.manage. '
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [is_available], properties: {is_available: {type: boolean}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {product: {$ref: '#/components/schemas/Product'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/products/{id}/price-history:
    get:
      summary: Price history, newest first
      description: 'Needs permission catalogue.manage. '
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {price_cents: {type: integer, format: int64}, effective_from: {type: string, format: date-time}, changed_by: {type: integer, format: int64, nullable: true}}}}}}
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/modifiers:
    get:
      summary: List modifiers
      description: 'Needs permission catalogue.manage. '
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Modifier'}}}}
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Add a modifier
      description: 'Needs permission catalogue.manage. price_delta_cents may be negative or zero. Name is unique (409 conflict).'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string}, price_delta_cents: {type: integer, format: int64}}}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {modifier: {$ref: '#/components/schemas/Modifier'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/modifiers/{id}:
    patch:
      summary: Change a modifier
      description: 'Needs permission catalogue.manage. '
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {name: {type: string}, price_delta_cents: {type: integer, format: int64}, active: {type: boolean}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {modifier: {$ref: '#/components/schemas/Modifier'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/tables:
    get:
      summary: List dining tables
      description: 'Needs permission orders.manage. open_order_id is the first open or sent order at the table, if any.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/DiningTable'}}}}
        '401': *id001
        '403': *id001
    post:
      summary: Add a dining table
      description: 'Needs permission catalogue.manage. Label is unique (409 conflict).'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [label, seats], properties: {label: {type: string}, seats: {type: integer, minimum: 1, maximum: 100}}}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {table: {$ref: '#/components/schemas/DiningTable'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/tables/{id}:
    patch:
      summary: Change a dining table
      description: 'Needs permission catalogue.manage.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {label: {type: string}, seats: {type: integer}, active: {type: boolean}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {table: {$ref: '#/components/schemas/DiningTable'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/orders:
    get:
      summary: List orders
      description: 'Needs permission orders.manage. Newest first. Roles other than Super Admin, Business Manager, Cashier and Accountant / Auditor see only the orders they opened (assumption S-43). Filters: status, table_id; paging: limit (default 50, max 100) and cursor (next_cursor of the previous page).'
      security:
      - sessionCookie: []
      parameters:
      - {name: status, in: query, schema: {type: string, enum: [open, sent, finalised, cancelled]}}
      - {name: table_id, in: query, schema: {type: integer, format: int64}}
      - {name: limit, in: query, schema: {type: integer}}
      - {name: cursor, in: query, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/OrderSummary'}}, next_cursor: {type: string}}}
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Open an order
      description: 'Needs permission orders.manage. A dine-in order needs an active table; a takeaway order has none. The order number comes from a gapless counter. The Idempotency-Key header is honoured from Stage 10b.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [order_type], properties: {order_type: {type: string, enum: [dine_in, takeaway]}, table_id: {type: integer, format: int64}, note: {type: string, maxLength: 200}}}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {order: {$ref: '#/components/schemas/Order'}}}
        '400': *id001
        '401': *id001
        '403': *id001
  /api/v1/orders/{id}:
    get:
      summary: Get an order with its items
      description: 'Needs permission orders.manage. An order opened by someone else is 404 for roles limited to their own orders.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {order: {$ref: '#/components/schemas/Order'}}}
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/orders/{id}/items:
    post:
      summary: Add an item
      description: 'Needs permission orders.manage. The price is taken from the catalogue on the server; a client-supplied price is rejected as an unknown field. The product must be available (409 product_unavailable) and each modifier offered by it.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [product_id, qty], properties: {product_id: {type: integer, format: int64}, qty: {type: integer, minimum: 1, maximum: 999}, note: {type: string, maxLength: 200}, modifier_ids: {type: array, items: {type: integer, format: int64}}, expected_version: {type: integer, description: 'the order version the screen showed; a different current version returns 409 order_changed'}}}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {order: {$ref: '#/components/schemas/Order'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/orders/{id}/items/{itemId}:
    patch:
      summary: Change an item's quantity or note
      description: 'Needs permission orders.manage. Order must be open or sent. A cancelled item cannot be changed (409 item_cancelled).'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {qty: {type: integer}, note: {type: string}, expected_version: {type: integer, description: 'the order version the screen showed; a different current version returns 409 order_changed'}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {order: {$ref: '#/components/schemas/Order'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/orders/{id}/items/{itemId}/cancel:
    post:
      summary: Cancel an item
      description: 'Needs permission orders.manage. A reason is required and the cancellation is audited. Cancelling a line that was already sent will raise a kitchen ticket in Stage 10b.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 200}, expected_version: {type: integer, description: 'the order version the screen showed; a different current version returns 409 order_changed'}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {order: {$ref: '#/components/schemas/Order'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/orders/{id}/cancel:
    post:
      summary: Cancel an order
      description: 'Needs permission orders.manage. A reason is required and the cancellation is audited. An order already sent to the kitchen returns 409 order_sent until Stage 10b adds kitchen cancel tickets.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 200}, expected_version: {type: integer, description: 'the order version the screen showed; a different current version returns 409 order_changed'}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {order: {$ref: '#/components/schemas/Order'}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zuscar_session
      description: HttpOnly session cookie. State-changing requests also need the X-CSRF-Token header (value of the zuscar_csrf
        cookie).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Required on every route that creates money or stock effects (see routes.csv).
  schemas:
    DiningTable:
      type: object
      properties:
        id: {type: integer, format: int64}
        label: {type: string}
        seats: {type: integer}
        active: {type: boolean}
        open_order_id: {type: integer, format: int64, nullable: true}
    OrderSummary:
      type: object
      properties:
        id: {type: integer, format: int64}
        order_no: {type: integer, format: int64}
        order_type: {type: string, enum: [dine_in, takeaway]}
        table_id: {type: integer, format: int64, nullable: true}
        table_label: {type: string}
        status: {type: string, enum: [open, sent, finalised, cancelled]}
        opened_by: {type: integer, format: int64}
        opened_by_name: {type: string}
        note: {type: string}
        version: {type: integer}
        cancel_reason: {type: string}
        subtotal_cents: {type: integer, format: int64, description: 'active lines only, before tax'}
        item_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Order:
      allOf:
      - $ref: '#/components/schemas/OrderSummary'
      - type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                id: {type: integer, format: int64}
                product_id: {type: integer, format: int64}
                name: {type: string}
                kitchen_routed: {type: boolean}
                qty: {type: integer}
                unit_price_cents: {type: integer, format: int64}
                line_total_cents: {type: integer, format: int64}
                status: {type: string, enum: [active, cancelled]}
                note: {type: string}
                cancel_reason: {type: string}
                modifiers: {type: array, items: {type: object, properties: {id: {type: integer, format: int64}, name: {type: string}, price_delta_cents: {type: integer, format: int64}}}}
    Category:
      type: object
      properties:
        id: {type: integer, format: int64}
        module: {type: string, enum: [restaurant, bar]}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
    Modifier:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        price_delta_cents: {type: integer, format: int64}
        active: {type: boolean}
    Product:
      type: object
      properties:
        id: {type: integer, format: int64}
        category_id: {type: integer, format: int64}
        category_name: {type: string}
        module: {type: string, enum: [restaurant, bar]}
        name: {type: string}
        sku: {type: string, nullable: true}
        price_cents: {type: integer, format: int64}
        tax_rate: {type: object, properties: {id: {type: integer, format: int64}, code: {type: string}, name: {type: string}, rate_bp: {type: integer}, treatment: {type: string, enum: [standard, zero_rated, exempt]}}}
        is_available: {type: boolean}
        kitchen_routed: {type: boolean}
        modifier_ids: {type: array, items: {type: integer, format: int64}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TaxRate:
      type: object
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        rate_bp: {type: integer}
        treatment: {type: string, enum: [standard, zero_rated, exempt]}
        active: {type: boolean}
    AuditEntry:
      type: object
      properties:
        id: {type: integer, format: int64}
        occurred_at: {type: string, format: date-time}
        actor_user_id: {type: integer, format: int64, nullable: true}
        actor_label: {type: string}
        action: {type: string}
        entity_type: {type: string}
        entity_id: {type: string}
        reason: {type: string}
        result: {type: string}
        before: {nullable: true}
        after: {nullable: true}
        request_id: {type: string}
        ip: {type: string}
    Role:
      type: object
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        is_protected: {type: boolean}
        is_template: {type: boolean}
        permissions:
          type: array
          items: {type: string}
        user_count: {type: integer}
    User:
      type: object
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [active, inactive]}
        must_change_password: {type: boolean}
        last_login_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        deactivated_at: {type: string, format: date-time, nullable: true}
        roles:
          type: array
          items: {type: string}
    ErrorBody:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            fields:
              type: array
              items:
                type: object
                required:
                - field
                - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
