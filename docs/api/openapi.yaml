  /api/v1/orders:
    get:
      summary: List orders
      description: 'Needs permission orders.manage. Newest first. Roles other than Super Admin, Business Manager, Cashier and Accountant / Auditor see only the orders they opened (assumption S-43). Filters: status, table_id; paging: limit (default 50, max 100) and cursor (next_cursor of the previous page).'
      security:
      - sessionCookie: []
      parameters:
      - {name: status, in: query, schema: {type: string, enum: [open, sent, finalised, cancelled]}}
      - {name: table_id, in: query, schema: {type: integer, format: int64}}
      - {name: limit, in: query, schema: {type: integer}}
      - {name: cursor, in: query, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/OrderSummary'}}, next_cursor: {type: string}}}
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Open an order
      description: 'Needs permission orders.manage. A dine-in order needs an active table; a takeaway order has none. The order number comes from a gapless counter. The Idempotency-Key header is optional here: Idempotency-Key: the same key with the same request returns the stored response (header Idempotent-Replayed: true) and does the work once; the same key with a different request or user is 422 idempotency_key_reused; a request still being processed answers 409 idempotency_conflict after a short wait. Only successful responses are stored, so a failed request leaves its key free for a corrected retry. Keys are kept for the idempotency_ttl_hours setting, never less than 24 hours (S-06). The stored response has the same content, with JSON keys possibly in a different order.'
      security:
      - sessionCookie: []
      parameters:
      - {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [order_type], properties: {order_type: {type: string, enum: [dine_in, takeaway]}, table_id: {type: integer, format: int64}, note: {type: string, maxLength: 200}}}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {order: {$ref: '#/components/schemas/Order'}}}
