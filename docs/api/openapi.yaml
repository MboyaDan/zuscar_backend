        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/orders/{id}/bill:
    get:
      summary: Bill for an order
      description: 'Needs permission sales.create. What the order costs now, from the server prices; writes nothing. Includes tax_inclusive and tax_status (provisional_unverified until the tax configuration is verified in Settings).'
      security:
