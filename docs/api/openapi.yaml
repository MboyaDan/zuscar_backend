    post:
      summary: Queue the first print of a document
      description: 'Needs a signed-in user and the permission of the document type (receipt sales.view, kitchen_ticket kitchen.view, bill sales.create, test_page none). The sale, ticket or bill must already exist; this never changes it. A voided sale''s receipt gets 409 sale_voided, and a sale entered from a paper receipt gets 409 outage_entry. The job keeps a frozen copy of the document. A receipt or kitchen ticket has exactly one original job: asking again returns that job with 200 and created=false, so a double tap or a retry cannot queue a second first copy. A bill or test page always makes a new job. The Idempotency-Key header is optional because nothing money-related is created, but a screen that retries should send one: the same key returns the first answer (Idempotent-Replayed: true), the same key with a different body returns 422 idempotency_key_reused.'
      security:
      - sessionCookie: []
      parameters:
      - {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [doc_type], properties: {doc_type: {type: string, enum: [receipt, kitchen_ticket, bill, test_page]}, ref_id: {type: integer, format: int64, description: 'sale id, ticket id or order id; omit for test_page'}}}
      responses:
        '200':
          description: The existing original job
          content:
            application/json:
              schema: {type: object, properties: {job: {type: object}, created: {type: boolean}}}
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {job: {type: object}, created: {type: boolean}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
    get:
      summary: List print jobs
      description: 'Any signed-in user sees the jobs they created; Super Admin and Business Manager see all. Newest first; cursor is the id of the last row.'
      security:
      - sessionCookie: []
      parameters:
      - {name: status, in: query, schema: {type: string, enum: [queued, printed, failed, reprinted]}}
      - {name: doc_type, in: query, schema: {type: string, enum: [receipt, kitchen_ticket, bill, test_page]}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {jobs: {type: array, items: {type: object}}, next_cursor: {type: string}}}
        '400': *id001
        '401': *id001
  /api/v1/print/jobs/{id}:
    get:
      summary: One print job with its document and attempts
      description: 'The creator or a manager; anyone else gets 404.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {job: {type: object}}}
        '401': *id001
        '404': *id001
  /api/v1/print/jobs/{id}/attempts:
    post:
      summary: Record what happened at the printer
      description: 'outcome printed or failed, with an optional note. Only a queued job takes a result (409 invalid_transition otherwise). printed is the person''s confirmation: a browser cannot prove paper came out (DG-03). A printed original becomes printed, a printed copy becomes reprinted, a failure becomes failed and the job is kept for a retry.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [outcome], properties: {outcome: {type: string, enum: [printed, failed]}, note: {type: string, maxLength: 200}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {job: {type: object}}}
        '400': *id001
        '401': *id001
        '404': *id001
        '409': *id001
  /api/v1/print/jobs/{id}/retry:
    post:
      summary: Put a failed print job back in the queue
      description: 'The same job: no new record and no new number. 409 invalid_transition unless the job is failed.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {job: {type: object}}}
        '401': *id001
        '404': *id001
        '409': *id001
  /api/v1/print/jobs/{id}/reprint:
    post:
      summary: Print a copy of a job that already printed
      description: 'Creates a new job linked to the first (reprint_of), numbered (copy_no), carrying the same frozen document, and writes an audit row. Needs sales.reprint for a receipt, kitchen.view for a ticket, sales.create for a bill. 409 not_printed unless the source printed. 409 sale_voided for the receipt of a voided sale. The sale and ticket are untouched. The frontend must show a REPRINT marker when is_reprint is true.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {job: {type: object}}}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/inventory/units:
    get:
      summary: List units of measure
      description: 'Needs inventory.view. Piece (pc), millilitre (ml) and gram (g) are seeded. Bottles, crates and shots are not units of the code: they are conversions per item.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Add a unit
      description: 'Needs inventory.adjust. code is lower case letters, digits and underscore, 1 to 16 characters.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code, name], properties: {code: {type: string}, name: {type: string}}}
      responses:
        '201':
          description: Created
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/inventory/locations:
    get:
      summary: List stock locations
      description: 'Needs inventory.view. Main store, Bar and Kitchen are seeded. A sale takes bar products from the bar and everything else from the kitchen (S-72).'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Add a stock location
      description: 'Needs inventory.adjust.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code, name], properties: {code: {type: string}, name: {type: string}}}
      responses:
        '201':
          description: Created
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/inventory/items:
    get:
      summary: List inventory items
      description: 'Needs inventory.view. Each item carries its total in base units, a low flag when the total is at or under its low-stock level, its conversions and its balance per location. q searches by name or SKU; active=true hides switched-off items.'
      security:
      - sessionCookie: []
      parameters:
      - {name: q, in: query, schema: {type: string}}
      - {name: active, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: OK
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Add an inventory item
      description: 'Needs inventory.adjust. The base unit cannot be changed afterwards. Names and SKUs are unique ignoring case (409).'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name, base_unit_id], properties: {name: {type: string}, sku: {type: string}, base_unit_id: {type: integer, format: int64}, low_stock_threshold: {type: integer, format: int64, nullable: true}}}
      responses:
        '201':
          description: Created
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/inventory/items/{id}:
    patch:
      summary: Change an inventory item
      description: 'Needs inventory.adjust. name, sku (empty clears it), low_stock_threshold (null clears it) and active. Stock is never changed here.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {name: {type: string}, sku: {type: string}, low_stock_threshold: {type: integer, format: int64, nullable: true}, active: {type: boolean}}}
      responses:
        '200':
          description: OK
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/inventory/items/{id}/conversions:
    put:
      summary: Replace an items conversions
      description: 'Needs inventory.adjust. Replaces every conversion of the item. factor_num / factor_den base units per unit (factor_den defaults to 1), for example 1 crate = 24 pieces. A conversion always ends in the item base unit.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [conversions], properties: {conversions: {type: array, items: {type: object, required: [unit_id, factor_num], properties: {unit_id: {type: integer, format: int64}, factor_num: {type: integer, format: int64}, factor_den: {type: integer, format: int64}}}}}}
      responses:
        '200':
          description: OK
        '400': *id001
        '401': *id001
        '403': *id001
  /api/v1/inventory/balances:
    get:
      summary: Stock balances
      description: 'Needs inventory.view. Always worked out from the ledger (sum of movements per item and location); nothing is stored.'
      security:
      - sessionCookie: []
      parameters:
      - {name: item_id, in: query, schema: {type: integer, format: int64}}
      - {name: location_id, in: query, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: OK
        '400': *id001
        '401': *id001
        '403': *id001
  /api/v1/inventory/movements:
    get:
      summary: Stock movements
      description: 'Needs inventory.view. Newest first; page with before_id and limit. Each row says what it is, who made it, what the person typed, whether it was reversed and any override reason.'
      security:
      - sessionCookie: []
      parameters:
      - {name: item_id, in: query, schema: {type: integer, format: int64}}
      - {name: location_id, in: query, schema: {type: integer, format: int64}}
      - {name: before_id, in: query, schema: {type: integer, format: int64}}
      - {name: limit, in: query, schema: {type: integer, format: int64}}
      - {name: type, in: query, schema: {type: string}}
      responses:
        '200':
          description: OK
        '400': *id001
        '401': *id001
        '403': *id001
  /api/v1/inventory/opening-balances:
    post:
      summary: Set opening stock
      description: 'Needs inventory.adjust and the Idempotency-Key header. One opening balance per item and location (409 opening_exists); after that stock moves by adjustments, counts, receipts and sales. Quantities may be typed in any unit the item has a conversion for and must come to a whole number of base units.'
      security:
      - sessionCookie: []
      parameters:
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [location_id, lines], properties: {location_id: {type: integer, format: int64}, note: {type: string}, lines: {type: array, items: {type: object, required: [item_id, qty], properties: {item_id: {type: integer, format: int64}, qty: {type: integer, format: int64}, unit_id: {type: integer, format: int64}}}}}}
      responses:
        '201':
          description: Created
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/inventory/adjustments:
    post:
      summary: Adjust stock with a reason
      description: 'Needs inventory.adjust and the Idempotency-Key header. qty is positive to add and negative to take away. A reason of 1 to 200 characters is required. Taking stock below zero answers 409 negative_stock unless override_negative is true with an override_reason, which needs inventory.override_negative (403 override_not_permitted). Under the block policy it is always 409 insufficient_stock.'
      security:
      - sessionCookie: []
      parameters:
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [item_id, location_id, qty, reason], properties: {item_id: {type: integer, format: int64}, location_id: {type: integer, format: int64}, qty: {type: integer, format: int64}, unit_id: {type: integer, format: int64}, reason: {type: string}, override_negative: {type: boolean}, override_reason: {type: string}}}
      responses:
        '201':
          description: Created
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/inventory/movements/{id}/reverse:
    post:
      summary: Reverse a movement
      description: 'Needs inventory.adjust and the Idempotency-Key header. Writes an exact opposite movement that points at the original; the original is never changed. 409 already_reversed, or not_reversible for sales, transfers and reversals (a sale is corrected by a void or refund). The same negative-stock rules as an adjustment apply.'
      security:
      - sessionCookie: []
      parameters:
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string}, override_negative: {type: boolean}, override_reason: {type: string}}}
      responses:
        '201':
          description: Created
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zuscar_session
      description: HttpOnly session cookie. State-changing requests also need the X-CSRF-Token header (value of the zuscar_csrf
        cookie).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Required on every route that creates money or stock effects (see routes.csv).
  schemas:
    Sale:
      type: object
      properties:
        id: {type: integer, format: int64}
        receipt_no: {type: integer, format: int64}
        order_id: {type: integer, format: int64, nullable: true}
        order_no: {type: integer, format: int64}
        manual_receipt: {type: object, nullable: true, description: 'the paper receipt behind an outage entry (Stage 16)', properties: {manual_receipt_no: {type: string}, occurred_at: {type: string, format: date-time}, paper_total_cents: {type: integer, format: int64}, discrepancy_note: {type: string}, source_note: {type: string}, entered_by: {type: integer, format: int64}, entered_by_name: {type: string}}}
        business_date: {type: string, format: date}
        subtotal_cents: {type: integer, format: int64}
        discount_cents: {type: integer, format: int64}
        tax_cents: {type: integer, format: int64, description: 'included in total_cents (prices include tax)'}
        total_cents: {type: integer, format: int64}
        paid_cents: {type: integer, format: int64}
        pending_cents: {type: integer, format: int64}
        balance_cents: {type: integer, format: int64}
        status: {type: string, enum: [finalised, partially_refunded, refunded, voided]}
        payment_status: {type: string, enum: [unpaid, partially_paid, paid, charged_to_folio]}
        tax_status: {type: string, enum: [provisional_unverified, verified]}
        cashier_id: {type: integer, format: int64}
        cashier_name: {type: string}
        shift_id: {type: integer, format: int64, nullable: true}
        items: {type: array, items: {type: object}, description: 'each line also carries refunded_qty, how many have been taken back'}
        payments: {type: array, items: {type: object}}
        refunded_cents: {type: integer, format: int64, description: 'money handed back so far, refunds and voids'}
        refunds: {type: array, items: {$ref: '#/components/schemas/Refund'}}
        voidable: {type: boolean, description: 'set when the sale is read on its own: finalised, no refund yet, and still the business date it was made (S-18)'}
    Refund:
      type: object
      properties:
        id: {type: integer, format: int64}
        refund_no: {type: integer, format: int64}
        kind: {type: string, enum: [refund, void]}
        reason: {type: string}
        approved_by: {type: integer, format: int64}
        approved_by_name: {type: string}
        created_by: {type: integer, format: int64}
        created_by_name: {type: string}
        business_date: {type: string, format: date}
        amount_cents: {type: integer, format: int64, description: 'value of the lines taken back, tax included'}
        tax_cents: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        items: {type: array, items: {type: object, properties: {sale_item_id: {type: integer, format: int64}, name: {type: string}, qty: {type: integer}, amount_cents: {type: integer, format: int64}, tax_cents: {type: integer, format: int64}}}}
        payouts: {type: array, items: {type: object, properties: {method: {type: string, enum: [cash, mpesa_manual, card_manual, bank_manual]}, amount_cents: {type: integer, format: int64}, reference: {type: string}, shift_id: {type: integer, format: int64, nullable: true}}}}
    DiningTable:
      type: object
      properties:
        id: {type: integer, format: int64}
        label: {type: string}
        seats: {type: integer}
        active: {type: boolean}
        open_order_id: {type: integer, format: int64, nullable: true}
    OrderSummary:
      type: object
      properties:
        id: {type: integer, format: int64}
        order_no: {type: integer, format: int64}
        order_type: {type: string, enum: [dine_in, takeaway]}
        table_id: {type: integer, format: int64, nullable: true}
        table_label: {type: string}
        status: {type: string, enum: [open, sent, finalised, cancelled]}
        opened_by: {type: integer, format: int64}
        opened_by_name: {type: string}
        note: {type: string}
        version: {type: integer}
        cancel_reason: {type: string}
        subtotal_cents: {type: integer, format: int64, description: 'active lines only, before tax'}
        item_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Order:
      allOf:
      - $ref: '#/components/schemas/OrderSummary'
      - type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                id: {type: integer, format: int64}
                product_id: {type: integer, format: int64}
                name: {type: string}
                kitchen_routed: {type: boolean}
                qty: {type: integer}
                unit_price_cents: {type: integer, format: int64}
                line_total_cents: {type: integer, format: int64}
                status: {type: string, enum: [active, cancelled]}
                note: {type: string}
                cancel_reason: {type: string}
                sent_to_kitchen: {type: boolean, description: 'true once the line is on a kitchen ticket'}
                modifiers: {type: array, items: {type: object, properties: {id: {type: integer, format: int64}, name: {type: string}, price_delta_cents: {type: integer, format: int64}}}}
    KitchenTicket:
      type: object
      properties:
        id: {type: integer, format: int64}
        order_id: {type: integer, format: int64}
        order_no: {type: integer, format: int64}
        order_type: {type: string, enum: [dine_in, takeaway]}
        table_label: {type: string}
        business_date: {type: string, format: date, description: 'in the venue time zone; ticket numbers restart each business date'}
        ticket_no: {type: integer, format: int64}
        kind: {type: string, enum: [original, update]}
        parent_ticket_id: {type: integer, format: int64, nullable: true, description: 'the original ticket, set only on an update ticket'}
        status: {type: string, enum: [submitted, preparing, ready, served, cancelled]}
        created_by_name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        lines:
          type: array
          items:
            type: object
            properties:
              order_item_id: {type: integer, format: int64}
              name: {type: string}
              qty: {type: integer}
              change_type: {type: string, enum: [add, cancel, modify]}
              modifiers: {type: string}
              note: {type: string}
        history:
          type: array
          description: 'only on the single-ticket read'
          items: {type: object, properties: {from_status: {type: string}, to_status: {type: string}, changed_by: {type: string}, at: {type: string, format: date-time}}}
    Category:
      type: object
      properties:
        id: {type: integer, format: int64}
        module: {type: string, enum: [restaurant, bar]}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
    Modifier:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        price_delta_cents: {type: integer, format: int64}
        active: {type: boolean}
    Product:
      type: object
      properties:
        id: {type: integer, format: int64}
        category_id: {type: integer, format: int64}
        category_name: {type: string}
        module: {type: string, enum: [restaurant, bar]}
        name: {type: string}
        sku: {type: string, nullable: true}
        price_cents: {type: integer, format: int64}
        tax_rate: {type: object, properties: {id: {type: integer, format: int64}, code: {type: string}, name: {type: string}, rate_bp: {type: integer}, treatment: {type: string, enum: [standard, zero_rated, exempt]}}}
        is_available: {type: boolean}
        kitchen_routed: {type: boolean}
        modifier_ids: {type: array, items: {type: integer, format: int64}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TaxRate:
      type: object
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        rate_bp: {type: integer}
        treatment: {type: string, enum: [standard, zero_rated, exempt]}
        active: {type: boolean}
    AuditEntry:
      type: object
      properties:
        id: {type: integer, format: int64}
        occurred_at: {type: string, format: date-time}
        actor_user_id: {type: integer, format: int64, nullable: true}
        actor_label: {type: string}
        action: {type: string}
        entity_type: {type: string}
        entity_id: {type: string}
        reason: {type: string}
        result: {type: string}
        before: {nullable: true}
        after: {nullable: true}
        request_id: {type: string}
        ip: {type: string}
    Role:
      type: object
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        is_protected: {type: boolean}
        is_template: {type: boolean}
        permissions:
          type: array
          items: {type: string}
        user_count: {type: integer}
    User:
      type: object
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [active, inactive]}
        must_change_password: {type: boolean}
        last_login_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        deactivated_at: {type: string, format: date-time, nullable: true}
        roles:
          type: array
          items: {type: string}
    ErrorBody:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
