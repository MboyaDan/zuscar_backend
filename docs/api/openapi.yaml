    post:
      summary: Move a kitchen ticket forward
      description: 'Needs permission kitchen.update. Forward only: submitted, preparing, ready, served; skipping forward is allowed (S-17). cancelled cannot be set here, only by cancelling the order. A ticket that is served or cancelled cannot move (409 invalid_transition). Payment status is never consulted (AC-04). Each change is recorded in the status history and the audit log.'
