      summary: Enter a paper receipt written during an outage
      description: 'Needs permission payments.reconcile and the Idempotency-Key header. One transaction: claims the key, refuses a paper receipt number already entered, takes the next receipt number, writes a sale with source outage_reconciliation (no order, no shift) with line snapshots and confirmed payments, the entry, and the audit event sale.outage_entered. manual_receipt_no is stored upper case with spaces removed (1 to 32 of A-Z 0-9 / . _ -). occurred_at must not be in the future or older than 31 days. Each line is a product, a quantity and the unit price on the paper receipt (tax included). paper_total_cents is the total written on the paper; if it differs from the lines, discrepancy_note is required (400). Payments follow the finalise rules except that they are confirmed at once; they may not add up to more than the total. Errors 409: duplicate_manual_receipt, duplicate_reference, tax_exclusive_unsupported, idempotency_conflict; 422 idempotency_key_reused. A replay returns the stored answer with Idempotent-Replayed: true.'
