        required: true
        content:
          application/json:
            schema: {type: object, required: [reason, lines, payouts], properties: {restock: {type: boolean, description: 'Put the refunded items back into stock (default false). A void always puts everything back.'}, reason: {type: string, minLength: 1, maxLength: 200}, lines: {type: array, items: {type: object, required: [sale_item_id, qty], properties: {sale_item_id: {type: integer, format: int64}, qty: {type: integer, minimum: 1}}}}, payouts: {type: array, items: {type: object, required: [method, amount_cents], properties: {method: {type: string, enum: [cash, mpesa_manual, card_manual, bank_manual]}, amount_cents: {type: integer, format: int64}, reference: {type: string, maxLength: 64}}}}}}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {sale: {$ref: '#/components/schemas/Sale'}, refund: {$ref: '#/components/schemas/Refund'}}}
        '400': *id001
        '401': *id001
