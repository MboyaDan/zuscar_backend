  /api/v1/orders/{id}/send-to-kitchen:
    post:
      summary: Send new lines to the kitchen
      description: 'Needs permission orders.manage. Puts every active kitchen-routed line that has not gone yet on a new ticket. The first send makes the original ticket and moves the order to sent; later sends make update tickets for lines added since. The ticket and its number are committed before the response (AC-04). 409 nothing_to_send when there is nothing new, and no ticket number is used. The Idempotency-Key header is required (400 without it), because a double click must not issue two ticket numbers. Idempotency-Key: the same key with the same request returns the stored response (header Idempotent-Replayed: true) and does the work once; the same key with a different request or user is 422 idempotency_key_reused; a request still being processed answers 409 idempotency_conflict after a short wait. Only successful responses are stored, so a failed request leaves its key free for a corrected retry. Keys are kept for the idempotency_ttl_hours setting, never less than 24 hours (S-06). The stored response has the same content, with JSON keys possibly in a different order.'
      security:
      - sessionCookie: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {expected_version: {type: integer, description: 'the order version the screen showed; a different current version returns 409 order_changed'}}}
      responses:
        '201':
          description: Created
