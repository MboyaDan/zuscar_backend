  /api/v1/sales/{id}/void:
    post:
      summary: Void a sale
      description: 'Needs permission sales.void and the Idempotency-Key header. For a sale that should never have happened (S-18): only while finalised, only the whole sale, only on the business date it was made, only while it has no refund. Needs a reason (1 to 200 characters). Adds a refund row of kind void listing every line and hands back the confirmed money by the methods it came in by; cash needs the caller to have an open shift (409 shift_required) and leaves that drawer. The sale and its payments are not edited and the receipt number is kept. Errors 409: sale_already_voided, void_after_refund, void_window_closed, pending_payments (confirm or fail them first), shift_required, refund_unsupported (charged to a folio), idempotency_conflict; 422 idempotency_key_reused. A replay returns the stored answer with Idempotent-Replayed: true.'
