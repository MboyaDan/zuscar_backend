      summary: Add a payment to a finalised sale
      description: 'Needs permission sales.create and the Idempotency-Key header. Locks the sale, so two payments racing for the last of the balance are decided one after the other. Cash is confirmed at once; mpesa_manual, card_manual and bank_manual are pending_confirmation until payments.reconcile confirms them and need a reference. Confirmed plus pending plus this amount may not exceed the total (400). Cash needs an open shift for the caller (409 shift_required). Errors 409: sale_not_payable (voided, refunded, paid or charged to a folio), duplicate_reference, idempotency_conflict; 422 idempotency_key_reused. A replay returns the stored answer with Idempotent-Replayed: true.'
