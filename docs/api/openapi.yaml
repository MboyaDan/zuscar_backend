        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
  /api/v1/sales/{id}/refunds:
    post:
      summary: Refund lines of a sale
      description: 'Needs permission sales.refund and the Idempotency-Key header. Any business day. Needs a reason (1 to 200 characters), at least one line with a quantity, and payouts (one per method) that add up to the refund. The sale is locked first, so refunds racing for the same line are decided one after the other. A line can be taken back in pieces; the pieces add up to exactly the line. A payout by a method may not pass the confirmed money received by that method less what was already returned (409 payout_exceeds_received). Cash needs the caller to have an open shift (409 shift_required) and leaves that drawer. Status becomes partially_refunded, then refunded when every line is back. Errors 409: sale_not_refundable (voided or fully refunded), refund_exceeds_sold, payout_exceeds_received, shift_required, refund_unsupported, idempotency_conflict; 422 idempotency_key_reused. A replay returns the stored answer with Idempotent-Replayed: true.'
