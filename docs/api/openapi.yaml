            schema: {type: object, required: [manual_receipt_no, occurred_at, lines, paper_total_cents], properties: {manual_receipt_no: {type: string, maxLength: 32}, occurred_at: {type: string, format: date-time}, lines: {type: array, items: {type: object, required: [product_id, qty, unit_price_cents], properties: {product_id: {type: integer, format: int64}, qty: {type: integer, minimum: 1, maximum: 999}, unit_price_cents: {type: integer, format: int64, minimum: 0}}}}, payments: {type: array, items: {type: object, required: [method, amount_cents], properties: {method: {type: string, enum: [cash, mpesa_manual, card_manual, bank_manual]}, amount_cents: {type: integer, format: int64}, reference: {type: string, maxLength: 64}}}}, paper_total_cents: {type: integer, format: int64}, discrepancy_note: {type: string, maxLength: 200}, source_note: {type: string, maxLength: 200}}}
