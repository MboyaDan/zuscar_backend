openapi: 3.0.3
info:
  title: Zuscar API
  version: 0.0.0
  description: 'Kept current every stage. Stage 4 documents only the platform endpoints. The planned route inventory is docs/api/routes.csv.
    Money is always integer cents.

    '
servers:
- url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Process liveness
      operationId: healthz
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
  /api/v1/health:
    get:
      summary: Liveness through the web proxy
      description: Reachable at the web origin as /api/v1/health; used by the connection indicator.
      operationId: apiHealth
      responses:
        '200':
          description: Backend is up
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
  /readyz:
    get:
      summary: Readiness (database reachable)
      operationId: readyz
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ready
        '503':
          description: Database not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/auth/login:
    post:
      summary: Sign in
      description: Sets the HttpOnly session cookie and the script-readable CSRF cookie. Rejects a foreign Origin. Locks the
        account after repeated failures.
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: &id002
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      display_name:
                        type: string
                  must_change_password:
                    type: boolean
                  expires_at:
                    type: string
                    format: date-time
        '400': &id001
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401': *id001
        '403': *id001
        '423': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
  /api/v1/auth/me:
    get:
      summary: Current user, roles and permissions
      description: Permissions are read from the database on every request.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: *id002
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  must_change_password:
                    type: boolean
                  auth_method:
                    type: string
                    enum:
                    - password
                    - pin
                  session:
                    type: object
        '401': *id001
      security:
      - sessionCookie: []
  /api/v1/auth/logout:
    post:
      summary: Sign out
      description: Revokes the session and clears both cookies. Needs X-CSRF-Token.
      responses:
        '204':
          description: Success
        '401': *id001
        '403': *id001
      security:
      - sessionCookie: []
  /api/v1/auth/change-password:
    post:
      summary: Change own password
      description: Ends every other session of the user. Wrong current passwords count toward lockout.
      responses:
        '204':
          description: Success
        '400': *id001
        '401': *id001
        '403': *id001
        '423': *id001
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
  /api/v1/auth/reauth:
    post:
      summary: Confirm password for sensitive actions
      description: Valid for 5 minutes. PIN sessions cannot do this.
      responses:
        '204':
          description: Success
        '401': *id001
        '403': *id001
        '423': *id001
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
  /api/v1/auth/pin-switch:
    post:
      summary: Hand the terminal to another floor user by PIN
      description: Floor roles only. The new session never outlives the current one.
      responses:
        '200':
          description: Switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: *id002
                  must_change_password:
                    type: boolean
                  expires_at:
                    type: string
                    format: date-time
        '400': *id001
        '401': *id001
        '403': *id001
        '423': *id001
        '429': *id001
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - pin
              properties:
                username:
                  type: string
                pin:
                  type: string
                  pattern: ^[0-9]{4,8}$
  /api/v1/users:
    get:
      summary: List users
      description: 'Needs permission users.update. Keyset paging: limit (1 to 200, default 50) and the opaque cursor from next_cursor. q matches a username prefix or part of a display name.'
      security:
      - sessionCookie: []
      parameters:
      - {name: status, in: query, schema: {type: string, enum: [active, inactive]}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  next_cursor:
                    type: string
        '400': *id001
        '401': *id001
        '403': *id001
    post:
      summary: Create a user
      description: 'Needs permission users.create. The account must change its password at first login. A role can only be granted by someone who holds its permissions, or by a system administrator. The password is never returned.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - username
                - display_name
                - password
                properties:
                  username: {type: string}
                  display_name: {type: string}
                  password: {type: string}
                  roles:
                    type: array
                    items:
                      type: string
      responses:
        '201':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/users/{id}:
    get:
      summary: Get one user
      description: 'Needs permission users.update.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401': *id001
        '403': *id001
        '404': *id001
    patch:
      summary: Change the display name
      description: 'Needs permission users.update. The username never changes. Audited with before and after values.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - display_name
                properties:
                  display_name: {type: string}
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
    delete:
      summary: Delete a user with no history
      description: 'Needs permission users.delete. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Accounts that signed in, assigned a role or appear in the audit trail are refused with has_history: deactivate them instead.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Done
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/users/{id}/roles:
    put:
      summary: Replace the user's roles
      description: 'Needs permission users.update. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Errors: escalation_refused, protected_account, self_action_refused, last_super_admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - roles
                properties:
                  roles:
                    type: array
                    items:
                      type: string
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/users/{id}/deactivate:
    post:
      summary: Deactivate a user
      description: 'Needs permission users.deactivate. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Ends every session of the account in the same transaction. The last active Super Admin is refused (last_super_admin). Repeating is harmless.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                  reason: {type: string}
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/users/{id}/reactivate:
    post:
      summary: Reactivate a user
      description: 'Needs permission users.update. Needs a password entered in the last 5 minutes (error reauth_required otherwise).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/users/{id}/reset-password:
    post:
      summary: Set a temporary password
      description: 'Needs permission users.update. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Forces a change at next login and ends all sessions of the account. Not for your own account (use change-password).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - new_password
                properties:
                  new_password: {type: string}
      responses:
        '204':
          description: Done
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/users/{id}/pin:
    put:
      summary: Set a fast-switch PIN
      description: 'Needs permission users.update. Floor roles only (A-07); 409 pin_not_allowed otherwise.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                required:
                - pin
                properties:
                  pin: {type: string, pattern: '^[0-9]{4,8}$'}
      responses:
        '204':
          description: Done
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/roles:
    get:
      summary: List roles with their permissions
      description: 'Needs permission roles.manage.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401': *id001
        '403': *id001
    post:
      summary: Create an empty role
      description: 'Needs permission roles.manage. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Permissions are granted separately.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - name
              properties:
                  code: {type: string, pattern: '^[a-z][a-z0-9_]{1,39}$'}
                  name: {type: string}
                  description: {type: string}
      responses:
        '201':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/Role'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/roles/assignable:
    get:
      summary: Roles the caller may grant
      description: 'Needs permission users.update (not roles.manage). Applies the same rule as changing a user''s roles: protected roles only with system.admin, otherwise only roles whose permissions the caller already holds. Use it to fill a role picker.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Grantable roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code: {type: string}
                        name: {type: string}
                        description: {type: string}
        '401': *id001
        '403': *id001
  /api/v1/roles/{id}:
    patch:
      summary: Change a role name and description
      description: 'Needs permission roles.manage. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Protected roles are refused (protected_role). The code never changes.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                  name: {type: string}
                  description: {type: string}
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/Role'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
    delete:
      summary: Delete an unassigned role
      description: 'Needs permission roles.manage. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Refused while the role is assigned (role_in_use) and always for protected roles.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Done
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/roles/{id}/permissions:
    put:
      summary: Replace a role's permission set
      description: 'Needs permission permissions.assign. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. system.admin is refused for everyone and protected roles are refused. Without system.admin you can only add permissions you hold (escalation_refused). The response lists the users affected; changes apply on their next request.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permissions
              properties:
                  permissions:
                    type: array
                    items:
                      type: string
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/Role'
                  affected_users:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer, format: int64}
                        username: {type: string}
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/permissions:
    get:
      summary: List permissions
      description: 'Needs permission roles.manage.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer, format: int64}
                        key: {type: string}
                        description: {type: string}
                        is_protected: {type: boolean}
        '401': *id001
        '403': *id001
  /api/v1/settings:
    get:
      summary: Read business settings
      description: 'Any signed-in user. All settings are non-secret business configuration, including tax_config_status (provisional_unverified or verified) and, once verified, tax_config_verified_by and tax_config_verified_at.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties: true
        '401': *id001
    patch:
      summary: Change business settings
      description: 'Needs permission system.admin. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Atomic: one invalid key changes nothing. Editable keys: business_name, address, phone, receipt_footer, timezone, tax_inclusive, negative_stock_policy (warn_override or block), checkin_time, checkout_time, idempotency_ttl_hours, tax_config_status. currency and the verification record cannot be changed. Setting tax_config_status to verified records who and when and is audited as settings.tax_config_verified. Changing tax_inclusive after verification returns the status to provisional_unverified.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - settings
              properties:
                settings:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: All settings after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties: true
        '400': *id001
        '401': *id001
        '403': *id001
  /api/v1/tax-rates:
    get:
      summary: List tax categories
      description: 'Any signed-in user. Treatment is standard, zero_rated or exempt; rate_bp is basis points.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxRate'
        '401': *id001
    post:
      summary: Add a tax category
      description: 'Needs permission system.admin. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. The treatment is fixed at creation; zero_rated and exempt need rate_bp 0.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - name
              - rate_bp
              - treatment
              properties:
                code: {type: string, pattern: '^[a-z][a-z0-9_]{1,39}$'}
                name: {type: string}
                rate_bp: {type: integer, minimum: 0, maximum: 10000}
                treatment: {type: string, enum: [standard, zero_rated, exempt]}
      responses:
        '201':
          description: The category
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_rate:
                    $ref: '#/components/schemas/TaxRate'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/tax-rates/{id}:
    patch:
      summary: Change a tax category
      description: 'Needs permission system.admin. Needs a password entered in the last 5 minutes (error reauth_required otherwise). Audited with before and after values. Changing the rate or the active flag after verification returns tax_config_status to provisional_unverified.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                rate_bp: {type: integer, minimum: 0, maximum: 10000}
                active: {type: boolean}
      responses:
        '200':
          description: The category
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax_rate:
                    $ref: '#/components/schemas/TaxRate'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/audit-logs:
    get:
      summary: Read the audit trail, newest first
      description: 'Needs permission audit.view. Security events (users, roles, permissions, sessions, settings, tax categories) are only returned to a system administrator or an Accountant / Auditor; everyone else with audit.view sees operational events only.'
      security:
      - sessionCookie: []
      parameters:
      - {name: action, in: query, schema: {type: string}}
      - {name: entity_type, in: query, schema: {type: string}}
      - {name: result, in: query, schema: {type: string, enum: [success, denied, failed]}}
      - {name: actor_id, in: query, schema: {type: integer, format: int64}}
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  next_cursor:
                    type: string
        '400': *id001
        '401': *id001
        '403': *id001
  /api/v1/menu:
    get:
      summary: What can be sold now
      description: 'Needs permission orders.manage. Active categories with their available products and active modifiers.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {categories: {type: array, items: {type: object}}}}
        '401': *id001
        '403': *id001
  /api/v1/categories:
    get:
      summary: List categories
      description: 'Needs permission catalogue.manage. '
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
