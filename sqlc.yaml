# sqlc generates the repository layer (identity, settings, catalogue, orders). Run `make sqlc` after changing queries or
# table migrations. Only table-defining migrations are listed: sqlc does not need the trigger files.
version: "2"
sql:
  - engine: postgresql
    queries: database/queries/identity
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0006_sessions_auth.sql]
    gen:
      go: { package: repository, out: internal/identity/repository, sql_package: pgx/v5 }
  - engine: postgresql
    queries: database/queries/settings
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0006_sessions_auth.sql]
    gen:
      go: { package: repository, out: internal/settings/repository, sql_package: pgx/v5 }
  - engine: postgresql
    queries: database/queries/catalogue
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0008_catalogue.sql, database/migrations/0018_inventory.sql, database/migrations/0019_stock_links.sql]
    gen:
      go: { package: repository, out: internal/catalogue/repository, sql_package: pgx/v5 }
  - engine: postgresql
    queries: database/queries/orders
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0008_catalogue.sql, database/migrations/0009_tables_orders.sql, database/migrations/0010_kitchen_tickets.sql, database/migrations/0018_inventory.sql, database/migrations/0019_stock_links.sql]
    gen:
      go: { package: repository, out: internal/orders/repository, sql_package: pgx/v5 }
  - engine: postgresql
    queries: database/queries/sales
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0008_catalogue.sql, database/migrations/0009_tables_orders.sql, database/migrations/0010_kitchen_tickets.sql, database/migrations/0012_sales.sql, database/migrations/0014_shifts.sql, database/migrations/0016_refunds.sql, database/migrations/0017_manual_receipts.sql, database/migrations/0018_inventory.sql, database/migrations/0019_stock_links.sql, database/migrations/0020_sale_stock_snapshot.sql]
    gen:
      go: { package: repository, out: internal/sales/repository, sql_package: pgx/v5 }
  - engine: postgresql
    queries: database/queries/printing
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0008_catalogue.sql, database/migrations/0009_tables_orders.sql, database/migrations/0010_kitchen_tickets.sql, database/migrations/0012_sales.sql, database/migrations/0014_shifts.sql, database/migrations/0015_print.sql, database/migrations/0018_inventory.sql, database/migrations/0019_stock_links.sql, database/migrations/0020_sale_stock_snapshot.sql]
    gen:
      go: { package: repository, out: internal/printing/repository, sql_package: pgx/v5 }
  - engine: postgresql
    queries: database/queries/inventory
    schema: [database/migrations/0002_identity.sql, database/migrations/0018_inventory.sql]
    gen:
      go: { package: repository, out: internal/inventory/repository, sql_package: pgx/v5 }
