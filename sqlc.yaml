# sqlc generates the repository layer (identity, settings, catalogue, orders). Run `make sqlc` after changing queries or
# table migrations. Only table-defining migrations are listed: sqlc does not need the trigger files.
version: "2"
sql:
  - engine: postgresql
    queries: database/queries/identity
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0006_sessions_auth.sql]
    gen:
      go: { package: repository, out: internal/identity/repository, sql_package: pgx/v5 }
  - engine: postgresql
    queries: database/queries/settings
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0006_sessions_auth.sql]
    gen:
      go: { package: repository, out: internal/settings/repository, sql_package: pgx/v5 }
  - engine: postgresql
    queries: database/queries/catalogue
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0008_catalogue.sql]
    gen:
      go: { package: repository, out: internal/catalogue/repository, sql_package: pgx/v5 }
  - engine: postgresql
    queries: database/queries/orders
    schema: [database/migrations/0002_identity.sql, database/migrations/0004_settings.sql, database/migrations/0005_tax_treatment.sql, database/migrations/0008_catalogue.sql, database/migrations/0009_tables_orders.sql, database/migrations/0010_kitchen_tickets.sql]
    gen:
      go: { package: repository, out: internal/orders/repository, sql_package: pgx/v5 }
